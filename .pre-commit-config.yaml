repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-w", "-s", "-ln", "bash"]
        exclude: '.*_out\.sh$|(^|/)emitted_.*\.sh$|(^|/)mocks\.sh$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: '.*_out\.sh$|(^|/)emitted_.*\.sh$|(^|/)mocks\.sh$'

  - repo: local
    hooks:
      - id: make-build
        name: Build
        entry: make build
        language: system
        pass_filenames: false

      - id: make-test
        name: Test
        entry: make test
        language: system
        pass_filenames: false

      - id: update-badges
        name: Update Badges & Enforce 100% Doc/Test Coverage
        entry: go run scripts/update_badges.go --check
        language: system
        pass_filenames: false
        always_run: true

      - id: swagger-2-petstore
        name: Swagger 2.0 Petstore Test
        entry: bash -c 'T=$(mktemp -d); trap "rm -rf $T" EXIT; S="../petstore.json"; [ -f "$S" ] || S="tests/test_swagger.json"; CDD_AST_PATH="$T/ast.json" ./cdd.sh from_openapi -i "$S" -o "$T/dir" && CDD_AST_PATH="$T/ast.json" ./cdd.sh to_openapi -i "$T/dir" -o "$T/out.json"'
        language: system
        pass_filenames: false

      - id: openapi-3-petstore
        name: OpenAPI 3.2.0 Petstore Test
        entry: bash -c 'T=$(mktemp -d); trap "rm -rf $T" EXIT; S="../petstore_oas3.json"; [ -f "$S" ] || S="tests/test.json"; CDD_AST_PATH="$T/ast.json" ./cdd.sh from_openapi -i "$S" -o "$T/dir" && CDD_AST_PATH="$T/ast.json" ./cdd.sh to_openapi -i "$T/dir" -o "$T/out.json"'
        language: system
        pass_filenames: false

      - id: swagger-2-petstore-server
        name: Swagger 2.0 Petstore Generated Server Test
        entry: bash -c 'if [ "${RUN_SLOW_TESTS:-0}" = "1" ]; then sh tests/test_generated_petstore_server.sh swagger ../petstore.json; else echo "Skipped due to RUN_SLOW_TESTS"; fi'
        language: system
        pass_filenames: false

      - id: openapi-3-petstore-server
        name: OpenAPI 3.2.0 Petstore Generated Server Test
        entry: bash -c 'if [ "${RUN_SLOW_TESTS:-0}" = "1" ]; then sh tests/test_generated_petstore_server.sh openapi ../petstore_oas3.json; else echo "Skipped due to RUN_SLOW_TESTS"; fi'
        language: system
        pass_filenames: false

      - id: arazzo-conformance
        name: Arazzo 1.1.0 Conformance & Bidirectional Workflow Test
        entry: sh tests/test_arazzo.sh
        language: system
        pass_filenames: false

      - id: make-build-wasm
        name: Build WASM
        entry: make build_wasm
        language: system
        pass_filenames: false
