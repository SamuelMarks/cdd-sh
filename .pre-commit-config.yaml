repos:
  - repo: local
    hooks:
      - id: run-tests-and-update-shields
        name: Run tests and update shields
        entry: ./update_shields.sh
        language: script
        pass_filenames: false

  - repo: local
    hooks:
      - id: update-badges
        name: Update Badges
        entry: python3 scripts/update_badges.py
        language: system
        files: ^README\.md$
        pass_filenames: false
