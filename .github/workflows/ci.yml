name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mock-server:
        image: swaggerapi/petstore
        ports:
          - 8100:8080
        env:
          SWAGGER_URL: http://localhost:8100/api/swagger.json
    env:
      RUN_SLOW_TESTS: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch Petstore Specs directly
        run: |
          wget -q https://petstore.swagger.io/v2/swagger.json -O ../petstore.json || echo "{}" > ../petstore.json
          wget -q https://petstore3.swagger.io/api/v3/openapi.json -O ../petstore_oas3.json || echo "{}" > ../petstore_oas3.json
          # Note: The true source of these files in the local workspace is one directory up, 
          # which in CI would be outside the actions/checkout workspace.
          # To make the paths in .pre-commit-config.yaml (`../petstore.json`) work,
          # we place them in the runner's workspace parent directory.
          cp ../petstore.json $GITHUB_WORKSPACE/../petstore.json || true
          cp ../petstore_oas3.json $GITHUB_WORKSPACE/../petstore_oas3.json || true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl socat netcat-traditional make shellcheck
          pipx install pre-commit

      - name: Run all pre-commit hooks
        run: pre-commit run --all-files

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install binaryen for WASM size optimization
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build WASM and Binary
        run: |
          make build
          make build_wasm

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/cdd-sh
            wasm_build/cdd-sh.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
