name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - '*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch Petstore Specs directly
        run: |
          wget -q https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/examples/v2.0/json/petstore.json -O ../petstore.json || echo "{}" > ../petstore.json
          wget -q https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/examples/v3.0/petstore.json -O ../petstore_oas3.json || echo "{}" > ../petstore_oas3.json
          # Note: The true source of these files in the local workspace is one directory up, 
          # which in CI would be outside the actions/checkout workspace.
          # To make the paths in .pre-commit-config.yaml (`../petstore.json`) work,
          # we place them in the runner's workspace parent directory.
          cp ../petstore.json $GITHUB_WORKSPACE/../petstore.json || true
          cp ../petstore_oas3.json $GITHUB_WORKSPACE/../petstore_oas3.json || true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl socat netcat-traditional make shellcheck
          pip install pre-commit

      - name: Run all pre-commit hooks
        run: pre-commit run --all-files

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build WASM and Binary
        run: |
          make build
          make build_wasm

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/cdd-sh
            wasm_build/cdd-sh.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag and release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release delete latest --cleanup-tag -y || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
          gh release create latest bin/cdd-sh wasm_build/cdd-sh.wasm --title "Latest" --notes "Tracks the most recent release."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
